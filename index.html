<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修正依頼テンプレ作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #12151b;
  --panel: #191e26;
  --panel-2: #1f2530;
  --border: #2a3140;
  --border-soft: #232a37;
  --text: #e9ecf2;
  --text-dim: #939cad;
  --text-faint: #616c80;
  --amber: #ffb020;
  --amber-text: #3a2400;
  --home: #4fb3ff;
  --away: #ff8a5c;
  --danger: #ff6b6b;
  --success: #45c08a;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'Noto Sans JP', 'Manrope', system-ui, sans-serif;
}
:root[data-theme="light"] {
  --bg: #f3f1ea;
  --panel: #ffffff;
  --panel-2: #ece8dc;
  --border: #d8d2c1;
  --border-soft: #e2ddce;
  --text: #22201a;
  --text-dim: #635d4d;
  --text-faint: #8c856f;
  --amber: #b8730f;
  --amber-text: #ffffff;
  --home: #1d6fb8;
  --away: #c15226;
  --danger: #c23b3b;
  --success: #227955;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f1ea;
    --panel: #ffffff;
    --panel-2: #ece8dc;
    --border: #d8d2c1;
    --border-soft: #e2ddce;
    --text: #22201a;
    --text-dim: #635d4d;
    --text-faint: #8c856f;
    --amber: #b8730f;
    --amber-text: #ffffff;
    --home: #1d6fb8;
    --away: #c15226;
    --danger: #c23b3b;
    --success: #227955;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  line-height: 1.6;
  padding: 28px 16px 60px;
}
.wrap { max-width: 980px; margin: 0 auto; }
.hero {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.hero h1 {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 22px;
  margin: 0;
  letter-spacing: 0.01em;
}
.hero p {
  margin: 4px 0 0;
  color: var(--text-dim);
  font-size: 13.5px;
  max-width: 40em;
}
.theme-toggle {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-dim);
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-family: var(--sans);
  cursor: pointer;
  flex-shrink: 0;
}
.theme-toggle:hover { border-color: var(--text-faint); color: var(--text); }

.grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 18px;
  align-items: start;
}
@media (max-width: 760px) {
  .grid { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 18px 20px;
}
.panel + .panel { margin-top: 18px; }

.panel-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}
#teamRosterBody.collapsed { display: none; }

.content-panel-wrap { display: none; }
.content-panel-wrap.show { display: block; }

.section-label {
  font-size: 11.5px;
  color: var(--text-faint);
  margin: 0 0 10px;
  font-weight: 500;
}
.section-sub {
  font-size: 11px;
  color: var(--text-faint);
  margin: 0 0 8px;
  font-weight: 600;
}

.seg {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.seg button {
  flex: 1 1 auto;
  min-width: 64px;
  padding: 9px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text-dim);
  font-family: var(--sans);
  font-size: 13.5px;
  cursor: pointer;
}
.seg button.active {
  border-color: var(--amber);
  background: var(--amber);
  color: var(--amber-text);
  font-weight: 700;
}
.seg button:not(.active):hover { border-color: var(--text-faint); }
.seg.small button { padding: 7px 9px; font-size: 12.5px; }

.row { margin-bottom: 16px; }
.row:last-child { margin-bottom: 0; }
label {
  display: block;
  font-size: 12.5px;
  color: var(--text-faint);
  margin-bottom: 6px;
}
.two-col {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
input[type="text"], select, textarea {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 10px;
  font-family: var(--sans);
  font-size: 14px;
}
input.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--amber);
}
textarea { resize: vertical; min-height: 56px; }

.clock-row { display: flex; align-items: center; gap: 6px; }
.clock-row select { width: 100%; text-align: center; font-size: 18px; font-family: var(--mono); text-align-last: center; }
.clock-row span { color: var(--text-faint); font-family: var(--mono); font-size: 18px; }

.detail-block { display: none; }
.detail-block.show { display: block; }
.sub-row { display: none; }
.sub-row.show { display: block; }

.err { font-size: 12px; color: var(--danger); margin-top: 5px; display: none; }
.err.show { display: block; }
.invalid { border-color: var(--danger) !important; }

.generate-btn {
  width: 100%;
  margin-top: 6px;
  padding: 12px;
  border-radius: 8px;
  border: none;
  background: var(--amber);
  color: var(--amber-text);
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14.5px;
  cursor: pointer;
}
.generate-btn:hover { filter: brightness(1.05); }

.output-card {
  background: var(--panel-2);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 14px 14px 12px;
}
.output-text {
  font-family: var(--mono);
  font-size: 13.5px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text);
  margin: 0 0 10px;
  min-height: 20px;
}
.output-empty { color: var(--text-faint); font-family: var(--sans); font-size: 13.5px; }
.copy-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  border-radius: 7px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-family: var(--sans);
  cursor: pointer;
}
.copy-btn:hover { border-color: var(--text-faint); color: var(--text); }
.copy-btn.copied { border-color: var(--success); color: var(--success); }

.history-item {
  border-top: 1px solid var(--border-soft);
  padding: 12px 0;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.history-item:first-child { border-top: none; padding-top: 4px; }
.history-text {
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-dim);
  flex: 1;
}
.history-actions { display: flex; gap: 6px; flex-shrink: 0; }
.history-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
.history-status { display: flex; gap: 10px; }
.hist-check {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-faint);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.hist-check input {
  width: 13px;
  height: 13px;
  margin: 0;
  cursor: pointer;
  accent-color: var(--amber);
}
.hist-check.on { color: var(--success); }
.icon-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-faint);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11.5px;
  font-family: var(--sans);
  cursor: pointer;
}
.icon-btn:hover { color: var(--text); border-color: var(--text-faint); }
.history-empty { color: var(--text-faint); font-size: 13px; }

.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  margin-right: 6px;
}
.badge.home { background: color-mix(in srgb, var(--home) 20%, transparent); color: var(--home); }
.badge.away { background: color-mix(in srgb, var(--away) 20%, transparent); color: var(--away); }

.roster-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
  gap: 6px;
  margin-bottom: 8px;
}
.roster-slot {
  width: 100%;
  text-align: center;
  font-family: var(--mono);
  font-size: 13px;
  padding: 7px 2px;
}
.roster-add-btn {
  border: 1px dashed var(--border);
  background: transparent;
  color: var(--text-faint);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: 12.5px;
  font-family: var(--sans);
  cursor: pointer;
}
.roster-add-btn:hover { border-color: var(--amber); color: var(--text); }
.roster-add-btn:disabled { opacity: 0.4; cursor: default; }
.roster-add-btn:disabled:hover { border-color: var(--border); color: var(--text-faint); }
.roster-custom { margin-top: 6px; }

</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div>
      <h1>修正依頼テンプレ作成</h1>
      <p>映像確認で見つかった記録ミスを、現地スタッツマンに送るチャット文にすばやく整形します。項目はFIBA公式の分類に沿っています。</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">画面の色を切り替え</button>
  </div>

  <div class="grid">

    <div>
      <div class="panel">
        <div class="panel-header-row">
          <div>
            <p class="section-label" style="margin-bottom:2px;">チーム名・背番号</p>
            <p class="section-sub" id="teamRosterSummary" style="margin:0;"></p>
          </div>
          <button class="theme-toggle" id="teamRosterToggle" type="button">閉じる</button>
        </div>
        <div id="teamRosterBody">
        <div class="two-col">
          <div>
            <label>ホーム チーム名</label>
            <input type="text" id="homeName" placeholder="例: A東京">
          </div>
          <div>
            <label>アウェイ チーム名</label>
            <input type="text" id="awayName" placeholder="例: 琉球">
          </div>
        </div>

        <div class="row" style="margin-top:16px">
          <label id="rosterHomeLabel">ホーム 背番号一覧</label>
          <div class="roster-grid" id="rosterHomeGrid"></div>
          <button class="roster-add-btn" id="rosterHomeAddBtn" type="button">+ 選手を追加</button>
        </div>
        <div class="row">
          <label id="rosterAwayLabel">アウェイ 背番号一覧</label>
          <div class="roster-grid" id="rosterAwayGrid"></div>
          <button class="roster-add-btn" id="rosterAwayAddBtn" type="button">+ 選手を追加</button>
        </div>
        </div>
      </div>

      <div class="panel">
        <p class="section-label">修正の種類</p>
        <div class="seg" id="seg-correction">
          <button data-val="修正" class="active" type="button">内容修正</button>
          <button data-val="挿入" type="button">挿入</button>
          <button data-val="削除" type="button">削除</button>
        </div>

        <div class="row" style="margin-top:18px">
          <label>ピリオド</label>
          <div class="seg" id="seg-period">
            <button data-val="1Q" class="active" type="button">1Q</button>
            <button data-val="2Q" type="button">2Q</button>
            <button data-val="3Q" type="button">3Q</button>
            <button data-val="4Q" type="button">4Q</button>
            <button data-val="OT1" type="button">OT1</button>
            <button data-val="OT2" type="button">OT2</button>
          </div>
        </div>

        <div class="row">
          <label>試合クロック(残り時間)</label>
          <div class="clock-row">
            <select id="clockMin"></select>
            <span>:</span>
            <select id="clockSec"></select>
          </div>
        </div>
      </div>

      <div class="panel content-panel-wrap" id="panelAWrap">
        <p class="section-label" id="contentLabelA">元の内容(修正前)</p>
        <div class="row two-col">
          <div>
            <label>チーム</label>
            <div class="seg team-seg" id="panelATeamSeg">
              <button data-val="home" class="active" type="button">ホーム</button>
              <button data-val="away" type="button">アウェイ</button>
            </div>
          </div>
          <div id="panelAPlayerWrap">
            <label>対象選手(背番号)</label>
            <select class="mono roster-select panelAPlayer-select" data-roster-rel="same"></select>
            <input class="mono roster-custom panelAPlayer-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            <div class="err" id="panelA-err-player">背番号を入力してください。</div>
          </div>
        </div>
        <div class="content-panel" id="panelA">
          <div class="row">
            <select class="f-playType">
              <option value="score">得点(フィールドゴール / フリースロー)</option>
              <option value="rebound">リバウンド</option>
              <option value="assist">アシスト</option>
              <option value="steal">スティール</option>
              <option value="block">ブロックショット</option>
              <option value="foul">ファウル</option>
              <option value="turnover">ターンオーバー</option>
              <option value="substitution">選手交代</option>
              <option value="timeout">タイムアウト</option>
              <option value="other">その他</option>
            </select>
          </div>

          <div class="detail-block show" data-detail="score">
            <div class="row two-col">
              <div>
                <label>シュート位置</label>
                <select class="f-scoreType">
                  <option value="2P">2ポイント</option>
                  <option value="3P">3ポイント</option>
                  <option value="ペイント内">ペイント内</option>
                  <option value="FT">フリースロー</option>
                </select>
              </div>
              <div>
                <label>結果</label>
                <select class="f-scoreResult">
                  <option value="カウント">カウント</option>
                  <option value="アウト">アウト</option>
                </select>
              </div>
            </div>
            <div class="row sub-row show score-shotstyle-row">
              <label>シュート種類(FIBA分類)</label>
              <select class="f-scoreShotStyle">
                <option value="">指定しない</option>
                <optgroup label="基本">
                  <option value="ジャンプシュート">ジャンプシュート</option>
                  <option value="レイアップ">レイアップ</option>
                  <option value="ダンク">ダンク</option>
                  <option value="プットバックダンク">プットバックダンク</option>
                  <option value="プットバックティップイン">プットバックティップイン</option>
                </optgroup>
                <optgroup label="応用">
                  <option value="ドライビングレイアップ">ドライビングレイアップ</option>
                  <option value="リバースレイアップ">リバースレイアップ</option>
                  <option value="ユーロステップ">ユーロステップ</option>
                  <option value="アリウープレイアップ">アリウープレイアップ</option>
                  <option value="アリウープダンク">アリウープダンク</option>
                  <option value="フックショット">フックショット</option>
                  <option value="フローティングジャンプショット">フローティングジャンプショット</option>
                  <option value="フェイドアウェイジャンプショット">フェイドアウェイジャンプショット</option>
                  <option value="ターンアラウンドジャンプショット">ターンアラウンドジャンプショット</option>
                  <option value="ステップバックジャンプショット">ステップバックジャンプショット</option>
                  <option value="プルアップジャンプショット">プルアップジャンプショット</option>
                </optgroup>
              </select>
            </div>
            <div class="row">
              <label>アシスト選手の背番号(あれば)</label>
              <select class="mono roster-select f-scoreAssist-select" data-roster-rel="same" data-special-value="アシストなし"></select>
              <input class="mono roster-custom f-scoreAssist-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            </div>
          </div>

          <div class="detail-block" data-detail="rebound">
            <div class="row">
              <label>種別</label>
              <select class="f-reboundType">
                <option value="オフェンスリバウンド">オフェンスリバウンド</option>
                <option value="ディフェンスリバウンド">ディフェンスリバウンド</option>
                <option value="チームリバウンド">チームリバウンド</option>
              </select>
            </div>
          </div>

          <div class="detail-block" data-detail="assist">
            <div class="row">
              <label>誰のシュートへのアシストか(背番号)</label>
              <select class="mono roster-select f-assistFor-select" data-roster-rel="same"></select>
              <input class="mono roster-custom f-assistFor-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            </div>
          </div>

          <div class="detail-block" data-detail="steal">
            <div class="row">
              <label>奪われた相手の背番号</label>
              <select class="mono roster-select f-stealFrom-select" data-roster-rel="opp"></select>
              <input class="mono roster-custom f-stealFrom-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            </div>
          </div>

          <div class="detail-block" data-detail="block">
            <div class="row">
              <label>シュートした相手の背番号</label>
              <select class="mono roster-select f-blockShooter-select" data-roster-rel="opp"></select>
              <input class="mono roster-custom f-blockShooter-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            </div>
          </div>

          <div class="detail-block" data-detail="foul">
            <div class="row">
              <label>対象</label>
              <div class="seg small seg-foul-target">
                <button data-val="選手" class="active" type="button">選手</button>
                <button data-val="ヘッドコーチ" type="button">ヘッドコーチ</button>
                <button data-val="ベンチ" type="button">ベンチ</button>
              </div>
            </div>
            <div class="row">
              <label>種別(FIBA分類)</label>
              <select class="f-foulType">
                <option value="シューティングファウル">シューティングファウル</option>
                <option value="パーソナルファウル">パーソナルファウル</option>
                <option value="オフェンスファウル">オフェンスファウル</option>
                <option value="スローインファウル">スローインファウル</option>
                <option value="テクニカルファウル">テクニカルファウル</option>
                <option value="アンスポーツマンライクファウル">アンスポーツマンライクファウル</option>
                <option value="ディスクォリファイングファウル">ディスクォリファイングファウル</option>
              </select>
            </div>
            <div class="row sub-row show foul-on-row">
              <label>相手(ファウルされた選手)の背番号(あれば)</label>
              <select class="mono roster-select f-foulOn-select" data-roster-rel="opp"></select>
              <input class="mono roster-custom f-foulOn-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            </div>
          </div>

          <div class="detail-block" data-detail="turnover">
            <div class="row">
              <label>種別(FIBA分類)</label>
              <select class="f-turnoverType">
                <option value="バッドパス">バッドパス</option>
                <option value="ボールハンドリング/ファンブル">ボールハンドリング / ファンブル</option>
                <option value="アウトオブバウンズ">アウトオブバウンズ</option>
                <option value="トラベリング">トラベリング</option>
                <option value="3秒バイオレーション">3秒バイオレーション</option>
                <option value="5秒バイオレーション">5秒バイオレーション</option>
                <option value="8秒バイオレーション">8秒バイオレーション</option>
                <option value="ショットクロックバイオレーション">ショットクロックバイオレーション</option>
                <option value="バックコートバイオレーション">バックコートバイオレーション</option>
                <option value="オフェンスファウル">オフェンスファウル</option>
                <option value="オフェンスゴールテンディング">オフェンスゴールテンディング</option>
                <option value="ダブルドリブル">ダブルドリブル</option>
                <option value="キャリング/パーミング">キャリング / パーミング</option>
                <option value="その他">その他</option>
              </select>
            </div>
            <div class="row sub-row turnover-other-row">
              <label>内容(自由記入)</label>
              <input type="text" class="f-turnoverOther" placeholder="具体的な内容を記入">
            </div>
          </div>

          <div class="detail-block" data-detail="substitution">
            <div class="row two-col">
              <div>
                <label>IN(入る選手の背番号)</label>
                <select class="mono roster-select f-subIn-select" data-roster-rel="same"></select>
                <input class="mono roster-custom f-subIn-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
              </div>
              <div>
                <label>OUT(出る選手の背番号)</label>
                <select class="mono roster-select f-subOut-select" data-roster-rel="same"></select>
                <input class="mono roster-custom f-subOut-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel content-panel-wrap show" id="modPanelWrap">
        <p class="section-label">訂正内容</p>
        <div class="row">
          <label>プレーの種類</label>
          <select id="modCategory">
            <option value="score">得点(フィールドゴール / フリースロー)</option>
            <option value="shotStyle">シュート種類</option>
            <option value="assist">アシスト</option>
            <option value="fastbreak">ファストブレイク</option>
            <option value="rebound">リバウンド</option>
            <option value="block">ブロックショット</option>
            <option value="turnover">ターンオーバー</option>
            <option value="foul">ファウル</option>
            <option value="substitution">選手交代</option>
            <option value="timeout">タイムアウト</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="row sub-row" id="modFoulTargetRow">
          <label>対象</label>
          <div class="seg small" id="modFoulTargetSeg">
            <button data-val="選手" class="active" type="button">選手</button>
            <button data-val="ヘッドコーチ" type="button">ヘッドコーチ</button>
            <button data-val="ベンチ" type="button">ベンチ</button>
          </div>
        </div>

        <div class="row" id="modAspectRow">
          <label>訂正したい項目</label>
          <select id="modAspect"></select>
        </div>

        <p class="section-sub" style="margin-top:14px;">記録</p>
        <div class="row two-col">
          <div>
            <label>チーム</label>
            <div class="seg team-seg" id="modTeamSeg">
              <button data-val="home" class="active" type="button">ホーム</button>
              <button data-val="away" type="button">アウェイ</button>
            </div>
          </div>
          <div id="modPlayerWrap">
            <label>対象選手(背番号)</label>
            <select class="mono roster-select modPlayer-select" data-roster-rel="same"></select>
            <input class="mono roster-custom modPlayer-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
            <div class="err" id="mod-err-player">背番号を入力してください。</div>
          </div>
        </div>

        <div class="row two-col" id="modTurnoverBeforeExtra" style="display:none;">
          <div>
            <label>修正前のターンオーバーの種類</label>
            <select id="modBeforeTurnoverType"></select>
            <input type="text" id="modBeforeTurnoverOther" placeholder="その他の内容" style="margin-top:6px;display:none">
          </div>
          <div>
            <label>修正前のスティール選手(背番号)</label>
            <select class="mono roster-select modBeforeStealPlayer-select" data-roster-rel="opp" data-special-value="スティールなし"></select>
            <input class="mono roster-custom modBeforeStealPlayer-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
          </div>
        </div>

        <div class="row two-col" id="modFoulBeforeExtra" style="display:none;">
          <div>
            <label>修正前のファウルの種類</label>
            <select id="modBeforeFoulType"></select>
          </div>
          <div>
            <label>修正前のREC選手(あれば)</label>
            <select class="mono roster-select modBeforeFoulOpponent-select" data-roster-rel="opp" data-special-value="相手なし"></select>
            <input class="mono roster-custom modBeforeFoulOpponent-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">
          </div>
        </div>

        <div class="row" id="modAfterClockRow">
          <button class="theme-toggle" id="modAfterClockToggle" type="button">クロックも修正する</button>
          <div class="clock-row" id="modAfterClockInputs" style="display:none;margin-top:10px;">
            <select id="modAfterClockMin"></select>
            <span>:</span>
            <select id="modAfterClockSec"></select>
          </div>
        </div>

        <div id="modFieldsContainer"></div>
      </div>

      <div class="panel">
        <div class="row">
          <label>修正理由(あれば)</label>
          <textarea id="memo" placeholder="例: リプレイでは本人のシュートではなくアシストのみでした"></textarea>
        </div>
        <button class="generate-btn" id="generateBtn" type="button">テンプレ文を作成</button>
      </div>
    </div>

    <div>
      <div class="panel">
        <p class="section-label">生成結果</p>
        <div class="output-card">
          <p class="output-text output-empty" id="outputText">左のフォームを入力して「テンプレ文を作成」を押してください。</p>
          <button class="copy-btn" id="copyBtn" type="button">コピー</button>
        </div>
      </div>

      <div class="panel">
        <p class="section-label">送信履歴(この端末のみに保存)</p>
        <div id="historyList">
          <p class="history-empty">まだ履歴はありません。</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function () {
  var root = document.documentElement;
  var THEME_KEY = 'fls_theme';
  var HISTORY_KEY = 'fls_history';
  var TEAM_KEY = 'fls_team_current';

  function applyStoredTheme() {
    try {
      var saved = localStorage.getItem(THEME_KEY);
      if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved);
    } catch (e) {}
  }
  applyStoredTheme();

  document.getElementById('themeToggle').addEventListener('click', function () {
    var current = root.getAttribute('data-theme');
    var mql = window.matchMedia('(prefers-color-scheme: light)').matches;
    var isLight = current === 'light' || (!current && mql);
    var next = isLight ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  function setupSeg(id, onChange) {
    var seg = document.getElementById(id);
    seg.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      if (onChange) onChange();
    });
  }

  function getSegValue(id) {
    var active = document.querySelector('#' + id + ' button.active');
    return active ? active.getAttribute('data-val') : '';
  }
  function getSegValueIn(panel, cls) {
    var active = panel.querySelector('.' + cls + ' button.active');
    return active ? active.getAttribute('data-val') : '';
  }

  var homeNameInput = document.getElementById('homeName');
  var awayNameInput = document.getElementById('awayName');

  function currentHomeName() { return homeNameInput.value.trim() || 'ホーム'; }
  function currentAwayName() { return awayNameInput.value.trim() || 'アウェイ'; }

  function refreshTeamLabels() {
    var homeName = currentHomeName();
    var awayName = currentAwayName();
    Array.prototype.forEach.call(document.querySelectorAll('.team-seg button[data-val="home"]'), function (b) { b.textContent = homeName; });
    Array.prototype.forEach.call(document.querySelectorAll('.team-seg button[data-val="away"]'), function (b) { b.textContent = awayName; });
  }

  function refreshRosterLabels() {
    var home = homeNameInput.value.trim();
    var away = awayNameInput.value.trim();
    document.getElementById('rosterHomeLabel').textContent = home ? 'ホーム(' + home + ') 背番号一覧' : 'ホーム 背番号一覧';
    document.getElementById('rosterAwayLabel').textContent = away ? 'アウェイ(' + away + ') 背番号一覧' : 'アウェイ 背番号一覧';
  }

  function loadCurrentTeam() {
    try {
      var raw = localStorage.getItem(TEAM_KEY);
      return raw ? JSON.parse(raw) : { home: '', away: '' };
    } catch (e) { return { home: '', away: '' }; }
  }
  function saveCurrentTeam() {
    try {
      localStorage.setItem(TEAM_KEY, JSON.stringify({ home: homeNameInput.value, away: awayNameInput.value }));
    } catch (e) {}
  }
  var initTeam = loadCurrentTeam();
  homeNameInput.value = initTeam.home || '';
  awayNameInput.value = initTeam.away || '';
  refreshTeamLabels();
  refreshRosterLabels();

  [homeNameInput, awayNameInput].forEach(function (el) {
    el.addEventListener('input', function () {
      refreshTeamLabels();
      refreshRosterLabels();
      saveCurrentTeam();
      updateTeamRosterSummary();
    });
  });

  var TEAM_PANEL_COLLAPSED_KEY = 'fls_team_panel_collapsed';
  var teamRosterBody = document.getElementById('teamRosterBody');
  var teamRosterToggle = document.getElementById('teamRosterToggle');
  var teamRosterSummary = document.getElementById('teamRosterSummary');

  function updateTeamRosterSummary() {
    teamRosterSummary.textContent = currentHomeName() + ' vs ' + currentAwayName();
  }

  function setTeamRosterCollapsed(collapsed) {
    teamRosterBody.classList.toggle('collapsed', collapsed);
    teamRosterToggle.textContent = collapsed ? '開く' : '閉じる';
    try { localStorage.setItem(TEAM_PANEL_COLLAPSED_KEY, collapsed ? '1' : '0'); } catch (e) {}
  }

  teamRosterToggle.addEventListener('click', function () {
    setTeamRosterCollapsed(!teamRosterBody.classList.contains('collapsed'));
  });

  var initCollapsed = false;
  try { initCollapsed = localStorage.getItem(TEAM_PANEL_COLLAPSED_KEY) === '1'; } catch (e) {}
  setTeamRosterCollapsed(initCollapsed);
  updateTeamRosterSummary();

  var ROSTER_KEY = 'fls_roster';
  var ROSTER_INITIAL = 12;
  var ROSTER_MAX = 15;

  function loadRosterData() {
    try {
      var raw = localStorage.getItem(ROSTER_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return { home: parsed.home || [], away: parsed.away || [] };
    } catch (e) { return { home: [], away: [] }; }
  }
  function saveRosterData() {
    try { localStorage.setItem(ROSTER_KEY, JSON.stringify(rosterData)); } catch (e) {}
  }

  var rosterData = loadRosterData();

  function rosterGridEl(team) { return document.getElementById(team === 'home' ? 'rosterHomeGrid' : 'rosterAwayGrid'); }
  function rosterAddBtnEl(team) { return document.getElementById(team === 'home' ? 'rosterHomeAddBtn' : 'rosterAwayAddBtn'); }

  function makeRosterSlot(team, value) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'mono roster-slot';
    inp.setAttribute('inputmode', 'numeric');
    inp.maxLength = 3;
    inp.placeholder = '#';
    inp.value = value || '';
    inp.addEventListener('input', function () { onRosterInputChange(team); });
    inp.addEventListener('blur', function () { sortRoster(team); });
    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { inp.blur(); }
    });
    return inp;
  }

  function sortRoster(team) {
    var arr = (rosterData[team] || []).slice();
    arr.sort(function (a, b) {
      var an = a === '' ? Infinity : parseInt(a, 10);
      var bn = b === '' ? Infinity : parseInt(b, 10);
      if (isNaN(an)) an = Infinity;
      if (isNaN(bn)) bn = Infinity;
      if (an === bn) return 0;
      return an - bn;
    });
    var changed = arr.some(function (v, i) { return v !== rosterData[team][i]; });
    if (!changed) return;
    rosterData[team] = arr;
    saveRosterData();
    buildRosterGrid(team);
    refreshAllRosterSelects();
  }

  function updateRosterAddBtn(team) {
    var grid = rosterGridEl(team);
    var btn = rosterAddBtnEl(team);
    var count = grid.querySelectorAll('.roster-slot').length;
    btn.disabled = count >= ROSTER_MAX;
  }

  function buildRosterGrid(team) {
    var grid = rosterGridEl(team);
    grid.innerHTML = '';
    var arr = rosterData[team];
    var slots = Math.max(ROSTER_INITIAL, arr.length);
    for (var i = 0; i < slots; i++) {
      grid.appendChild(makeRosterSlot(team, arr[i]));
    }
    updateRosterAddBtn(team);
  }

  function onRosterInputChange(team) {
    var grid = rosterGridEl(team);
    rosterData[team] = Array.prototype.map.call(grid.querySelectorAll('.roster-slot'), function (inp) {
      return inp.value.trim();
    });
    saveRosterData();
    refreshAllRosterSelects();
  }

  function addRosterSlot(team) {
    var grid = rosterGridEl(team);
    if (grid.querySelectorAll('.roster-slot').length >= ROSTER_MAX) return;
    grid.appendChild(makeRosterSlot(team, ''));
    updateRosterAddBtn(team);
  }

  document.getElementById('rosterHomeAddBtn').addEventListener('click', function () { addRosterSlot('home'); });
  document.getElementById('rosterAwayAddBtn').addEventListener('click', function () { addRosterSlot('away'); });

  buildRosterGrid('home');
  buildRosterGrid('away');

  function getRoster(team) {
    return (rosterData[team] || []).filter(function (v) { return v; });
  }

  function populateRosterSelect(selectEl, team) {
    var roster = getRoster(team);
    var prevValue = selectEl.value;
    var special = selectEl.dataset.specialValue || '';
    selectEl.innerHTML = '';
    var placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = '選択...';
    selectEl.appendChild(placeholder);
    if (special) {
      var specialOpt = document.createElement('option');
      specialOpt.value = special;
      specialOpt.textContent = special;
      selectEl.appendChild(specialOpt);
    }
    roster.forEach(function (num) {
      var opt = document.createElement('option');
      opt.value = num;
      opt.textContent = '#' + num;
      selectEl.appendChild(opt);
    });
    var customOpt = document.createElement('option');
    customOpt.value = '__custom__';
    customOpt.textContent = '直接入力...';
    selectEl.appendChild(customOpt);
    if (prevValue && (roster.indexOf(prevValue) !== -1 || prevValue === '__custom__' || (special && prevValue === special))) {
      selectEl.value = prevValue;
    }
  }

  function wireRosterSelect(selectEl) {
    if (selectEl.dataset.rosterWired) return;
    selectEl.dataset.rosterWired = '1';
    var custom = selectEl.parentNode.querySelector('.roster-custom');
    if (!custom) {
      // dynamically-built fields: custom input is the immediate next sibling
      custom = selectEl.nextElementSibling;
    }
    selectEl.addEventListener('change', function () {
      if (!custom) return;
      if (selectEl.value === '__custom__') {
        custom.style.display = 'block';
      } else {
        custom.style.display = 'none';
      }
    });
  }

  function localTeamFor(el) {
    if (el.dataset.rosterFixedTeam) return el.dataset.rosterFixedTeam;
    if (el.dataset.rosterTeamSeg) return getSegValue(el.dataset.rosterTeamSeg) || 'home';
    if (el.closest('#panelAWrap')) return getSegValue('panelATeamSeg') || 'home';
    if (el.closest('#modPanelWrap')) return getSegValue('modTeamSeg') || 'home';
    return 'home';
  }

  function refreshAllRosterSelects() {
    Array.prototype.forEach.call(document.querySelectorAll('.roster-select'), function (sel) {
      var rel = sel.getAttribute('data-roster-rel');
      var localTeam = localTeamFor(sel);
      var team = rel === 'opp' ? (localTeam === 'home' ? 'away' : 'home') : localTeam;
      populateRosterSelect(sel, team);
      wireRosterSelect(sel);
    });
  }

  function rosterPickerHTML(baseCls, rel, specialValue, teamSegId, fixedTeam) {
    return '<select class="mono roster-select ' + baseCls + '-select" data-roster-rel="' + rel + '"' +
      (specialValue ? ' data-special-value="' + specialValue + '"' : '') +
      (teamSegId ? ' data-roster-team-seg="' + teamSegId + '"' : '') +
      (fixedTeam ? ' data-roster-fixed-team="' + fixedTeam + '"' : '') + '></select>' +
      '<input class="mono roster-custom ' + baseCls + '-custom" type="text" placeholder="背番号を直接入力" inputmode="numeric" maxlength="3" style="display:none">';
  }

  var SPECIAL_PLAYER_VALUES = ['アシストなし', 'チームリバウンド', 'スティールなし', '相手なし'];
  function fmtPlayer(v) {
    if (!v) return '';
    return SPECIAL_PLAYER_VALUES.indexOf(v) !== -1 ? v : '#' + v;
  }

  function getRosterVal(panel, baseCls) {
    var sel = panel.querySelector('.' + baseCls + '-select');
    if (!sel) return '';
    if (sel.value === '__custom__') {
      var custom = panel.querySelector('.' + baseCls + '-custom');
      return custom ? custom.value.trim() : '';
    }
    return sel.value;
  }

  var clockMinSel = document.getElementById('clockMin');
  var clockSecSel = document.getElementById('clockSec');
  var modAfterClockMinSel = document.getElementById('modAfterClockMin');
  var modAfterClockSecSel = document.getElementById('modAfterClockSec');
  for (var m = 10; m >= 0; m--) {
    var mm = String(m).padStart(2, '0');
    var mo = document.createElement('option');
    mo.value = mm; mo.textContent = mm;
    clockMinSel.appendChild(mo);
    var mo2 = document.createElement('option');
    mo2.value = mm; mo2.textContent = mm;
    modAfterClockMinSel.appendChild(mo2);
  }
  for (var s = 59; s >= 0; s--) {
    var ss = String(s).padStart(2, '0');
    var so = document.createElement('option');
    so.value = ss; so.textContent = ss;
    clockSecSel.appendChild(so);
    var so2 = document.createElement('option');
    so2.value = ss; so2.textContent = ss;
    modAfterClockSecSel.appendChild(so2);
  }
  clockMinSel.value = '00';
  clockSecSel.value = '00';

  function syncAfterClockDefault() {
    modAfterClockMinSel.value = clockMinSel.value;
    modAfterClockSecSel.value = clockSecSel.value;
  }
  syncAfterClockDefault();

  var modAfterClockToggle = document.getElementById('modAfterClockToggle');
  var modAfterClockInputs = document.getElementById('modAfterClockInputs');
  var modAfterClockOpen = false;
  function setAfterClockOpen(open) {
    modAfterClockOpen = open;
    modAfterClockInputs.style.display = open ? 'flex' : 'none';
    modAfterClockToggle.textContent = open ? 'クロックの修正を閉じる' : 'クロックも修正する';
    if (!open) { syncAfterClockDefault(); }
  }
  modAfterClockToggle.addEventListener('click', function () { setAfterClockOpen(!modAfterClockOpen); });
  clockMinSel.addEventListener('change', function () { if (!modAfterClockOpen) syncAfterClockDefault(); });
  clockSecSel.addEventListener('change', function () { if (!modAfterClockOpen) syncAfterClockDefault(); });

  var playLabels = {
    score: '得点', rebound: 'リバウンド', assist: 'アシスト', steal: 'スティール',
    block: 'ブロックショット', foul: 'ファウル', turnover: 'ターンオーバー',
    substitution: '選手交代', timeout: 'タイムアウト', other: 'その他'
  };

  var SUBJECT_LABELS = {
    score: 'シュート選手', shotStyle: 'シュート選手', fastbreak: 'シュート選手', rebound: 'リバウンド選手',
    assist: 'アシスト選手', steal: 'スティール選手', block: 'ブロック選手',
    foul: 'ファウル選手', turnover: 'ターンオーバー選手'
  };
  function subjectLabelFor(type) {
    return (SUBJECT_LABELS[type] || '対象選手') + '(背番号)';
  }
  var MOD_SUBJECT_LABEL_OVERRIDES = { assist: 'シュート選手' };
  function modSubjectLabelFor(type) {
    return (MOD_SUBJECT_LABEL_OVERRIDES[type] || SUBJECT_LABELS[type] || '対象選手') + '(背番号)';
  }

  var panelAPlayerWrap = document.getElementById('panelAPlayerWrap');
  var modPlayerWrap = document.getElementById('modPlayerWrap');
  function panelAPlayerVal() { return getRosterVal(panelAPlayerWrap, 'panelAPlayer'); }
  function modPlayerVal() { return getRosterVal(modPlayerWrap, 'modPlayer'); }

  function setupPanel(panel) {
    var playTypeSel = panel.querySelector('.f-playType');
    function updateDetail() {
      var v = playTypeSel.value;
      Array.prototype.forEach.call(panel.querySelectorAll('.detail-block'), function (b) {
        b.classList.toggle('show', b.getAttribute('data-detail') === v);
      });
      var pSel = panelAPlayerWrap.querySelector('.panelAPlayer-select');
      if (v === 'rebound') { pSel.dataset.specialValue = 'チームリバウンド'; }
      else { delete pSel.dataset.specialValue; }
      panelAPlayerWrap.querySelector('label').textContent = subjectLabelFor(v);
      refreshAllRosterSelects();
      updatePanelAPlayerRequirement();
    }
    playTypeSel.addEventListener('change', updateDetail);

    var scoreTypeSel = panel.querySelector('.f-scoreType');
    var shotStyleRow = panel.querySelector('.score-shotstyle-row');
    scoreTypeSel.addEventListener('change', function () {
      shotStyleRow.classList.toggle('show', scoreTypeSel.value !== 'FT');
    });

    var turnoverSel = panel.querySelector('.f-turnoverType');
    var turnoverOtherRow = panel.querySelector('.turnover-other-row');
    turnoverSel.addEventListener('change', function () {
      turnoverOtherRow.classList.toggle('show', turnoverSel.value === 'その他');
    });

    var foulTargetSeg = panel.querySelector('.seg-foul-target');
    foulTargetSeg.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      Array.prototype.forEach.call(foulTargetSeg.querySelectorAll('button'), function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      updatePanelAPlayerRequirement();
    });

    updateDetail();
  }

  function panelPlayType(panel) { return panel.querySelector('.f-playType').value; }
  function panelNeedsPlayer(panel) {
    if (panelPlayType(panel) !== 'foul') return true;
    return getSegValueIn(panel, 'seg-foul-target') === '選手';
  }

  var MOD_ASPECTS = {
    score: [
      { key: 'scorer', label: '得点者(背番号)', field: 'primaryPlayer' },
      { key: 'scoreType', label: '得点の種類(シュート位置・結果・シュート種類)', field: 'scoreDetail' },
      { key: 'assist', label: 'アシスト', field: 'secondaryPlayer', fieldLabel: 'アシスト選手', rel: 'same' }
    ],
    shotStyle: [
      { key: 'style', label: 'シュートのシュート種類', field: 'shotStyleOnly' }
    ],
    fastbreak: [
      { key: 'flag', label: 'シュートのファストブレイク', field: 'fastbreakOnly' }
    ],
    rebound: [
      { key: 'player', label: 'リバウンド', field: 'primaryPlayer' }
    ],
    assist: [
      { key: 'player', label: 'シュートのアシスト選手', field: 'secondaryPlayer', fieldLabel: 'アシスト選手', rel: 'same' }
    ],
    block: [
      { key: 'player', label: 'ブロックした選手(背番号)', field: 'primaryPlayer' },
      { key: 'opponent', label: 'シュートした相手選手(背番号)', field: 'secondaryPlayer', fieldLabel: '相手選手', rel: 'opp' }
    ],
    foul: [
      { key: 'all', label: 'ファウル', field: 'foulFull' }
    ],
    turnover: [
      { key: 'all', label: 'ターンオーバー', field: 'turnoverFull' }

  function buildDetailLine(panel) {
    var type = panelPlayType(panel);
    if (type === 'score') {
      var scoreTypeVal = getVal(panel, 'f-scoreType') || '2P';
      var typeLabel = { '2P': '2ポイントシュート', '3P': '3ポイントシュート', 'ペイント内': 'ペイント内シュート', FT: 'フリースロー' }[scoreTypeVal];
      var result = getVal(panel, 'f-scoreResult');
      var style = getVal(panel, 'f-scoreShotStyle');
      var line = typeLabel + (style && scoreTypeVal !== 'FT' ? '(' + style + ')' : '') + ' / ' + result;
      var assist = getRosterVal(panel, 'f-scoreAssist');
      if (assist) line += '\nアシスト: ' + fmtPlayer(assist);
      return line;
    }
    if (type === 'rebound') {
      return getVal(panel, 'f-reboundType');
    }
    if (type === 'assist') {
      var f = getRosterVal(panel, 'f-assistFor');
      return 'アシスト' + (f ? '(#' + f + ' のシュートに対して)' : '');
    }
    if (type === 'steal') {
      var st = getRosterVal(panel, 'f-stealFrom');
      return 'スティール' + (st ? '(相手 #' + st + ')' : '');
    }
    if (type === 'block') {
      var b = getRosterVal(panel, 'f-blockShooter');
      return 'ブロックショット' + (b ? '(相手 #' + b + ' のシュート)' : '');
    }
    if (type === 'foul') {
      var ft = getVal(panel, 'f-foulType');
      var on = getRosterVal(panel, 'f-foulOn');
      return ft + (on ? '(相手 #' + on + ')' : '');
    }
    if (type === 'turnover') {
      var tt = getVal(panel, 'f-turnoverType');
      var other = getVal(panel, 'f-turnoverOther');
      return 'ターンオーバー(' + tt + (tt === 'その他' && other ? ': ' + other : '') + ')';
    }
    if (type === 'substitution') {
      var inP = getRosterVal(panel, 'f-subIn');
      var outP = getRosterVal(panel, 'f-subOut');
      var parts = [];
      if (inP) parts.push('IN #' + inP);
      if (outP) parts.push('OUT #' + outP);
      return '選手交代' + (parts.length ? '(' + parts.join(' / ') + ')' : '');
    }
    if (type === 'timeout') return 'タイムアウト';
    return '';
  }

  function buildScoreDetailText(prefix) {
    var typeVal = val(prefix + 'ScoreType') || '2P';
    var typeLabel = { '2P': '2ポイントシュート', '3P': '3ポイントシュート', 'ペイント内': 'ペイント内シュート', FT: 'フリースロー' }[typeVal];
    var result = val(prefix + 'ScoreResult');
    var style = val(prefix + 'ShotStyle');
    return typeLabel + (style && typeVal !== 'FT' ? '(' + style + ')' : '') + ' / ' + result;
  }
  function buildTurnoverText(prefix) {
    var tt = val(prefix + 'TurnoverType');
    var other = val(prefix + 'TurnoverOther');
    return tt + (tt === 'その他' && other ? ': ' + other : '');
  }

  function generate() {
    clearErrors();
    var correction = getSegValue('seg-correction');
    var needsPlayer, player, team, errElId, selEl;

    if (correction === '修正') {
      if (modCategorySel.value === 'substitution') needsPlayer = false;
      else if (modCategorySel.value === 'foul') needsPlayer = getSegValue('modFoulTargetSeg') === '選手';
      else needsPlayer = true;
      player = modPlayerVal();
      team = getSegValue('modTeamSeg');
      errElId = 'mod-err-player';
      selEl = modPlayerWrap.querySelector('.modPlayer-select');
    } else {
      needsPlayer = panelNeedsPlayer(panelA);
      player = panelAPlayerVal();
      team = getSegValue('panelATeamSeg');
      errElId = 'panelA-err-player';
      selEl = panelAPlayerWrap.querySelector('.panelAPlayer-select');
    }

    if (needsPlayer && !player) {
      document.getElementById(errElId).classList.add('show');
      selEl.classList.add('invalid');
      return null;
    }

    var clock = clockMinSel.value + ':' + clockSecSel.value;
    var period = getSegValue('seg-period');
    var teamName = team === 'home' ? currentHomeName() : currentAwayName();
    var correctionLabel = correction === '修正' ? '内容修正' : correction;

    var lines = [];

    if (correction === '修正') {
      var def = currentAspectDef();
      var subject = needsPlayer ? fmtPlayer(player) : (modCategorySel.value === 'foul' ? getSegValue('modFoulTargetSeg') : '');
      var afterClock = modAfterClockMinSel.value + ':' + modAfterClockSecSel.value;
      var clockPrefix = (modAfterClockOpen && afterClock !== clock) ? (afterClock + ' ') : '';

      if (def.field === 'primaryPlayer') {
        var afterVal = getRosterVal(modFieldsContainer, 'modAfterPlayer');
        var afterTeamName = teamName;
        if (modCategorySel.value === 'rebound') {
          var afterTeam = getSegValue('modAfterPlayerTeamSeg') || team;
          afterTeamName = afterTeam === 'home' ? currentHomeName() : currentAwayName();
        }
        lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　の' + def.label);
        lines.push(teamName + subject + ' → ' + clockPrefix + (afterTeamName !== teamName ? afterTeamName : '') + fmtPlayer(afterVal));
      } else if (def.field === 'turnoverFull') {
        var beforeOppTeamName = team === 'home' ? currentAwayName() : currentHomeName();
        var beforeTypeText = buildTurnoverText('modBefore');
        var beforeStealVal = getRosterVal(modPanelWrap, 'modBeforeStealPlayer');
        var beforeStealText = beforeStealVal ? (beforeStealVal === 'スティールなし' ? beforeStealVal : beforeOppTeamName + fmtPlayer(beforeStealVal)) : '';
        var beforeExtra = beforeTypeText + (beforeStealText ? '・スティール: ' + beforeStealText : '');

        var afterTeam2 = getSegValue('modTurnoverAfterTeamSeg') || team;
        var afterTeamName2 = afterTeam2 === 'home' ? currentHomeName() : currentAwayName();
        var afterOppTeamName = afterTeam2 === 'home' ? currentAwayName() : currentHomeName();
        var afterTurnoverVal = getRosterVal(modFieldsContainer, 'modAfterTurnoverPlayer');
        var afterTypeText = buildTurnoverText('modAfter');
        var afterStealVal = getRosterVal(modFieldsContainer, 'modAfterStealPlayer');
        var afterStealText = afterStealVal ? (afterStealVal === 'スティールなし' ? afterStealVal : afterOppTeamName + fmtPlayer(afterStealVal)) : '';
        var afterExtra = afterTypeText + (afterStealText ? '・スティール: ' + afterStealText : '');

        lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　のターンオーバー');
        lines.push(teamName + subject + '(' + beforeExtra + ')' + ' → ' + clockPrefix + (afterTeamName2 !== teamName ? afterTeamName2 : '') + fmtPlayer(afterTurnoverVal) + '(' + afterExtra + ')');
      } else if (def.field === 'foulFull') {
        var foulOppTeamName = team === 'home' ? currentAwayName() : currentHomeName();
        var afterFoulTeam = getSegValue('modFoulAfterTeamSeg') || team;
        var afterFoulTeamName = afterFoulTeam === 'home' ? currentHomeName() : currentAwayName();
        var afterFoulOppTeamName = afterFoulTeam === 'home' ? currentAwayName() : currentHomeName();
        var beforeFoulPlayer = fmtPlayer(player);
        var afterFoulPlayer = fmtPlayer(getRosterVal(modFieldsContainer, 'modAfterFoulPlayer'));
        var beforeFoulType = val('modBeforeFoulType');
        var afterFoulType = val('modAfterFoulType');
        var beforeFoulOppVal = getRosterVal(modPanelWrap, 'modBeforeFoulOpponent');
        var afterFoulOppVal = getRosterVal(modFieldsContainer, 'modAfterFoulOpponent');
        var beforeFoulOppText = beforeFoulOppVal ? (beforeFoulOppVal === '相手なし' ? beforeFoulOppVal : foulOppTeamName + fmtPlayer(beforeFoulOppVal)) : '';
        var afterFoulOppText = afterFoulOppVal ? (afterFoulOppVal === '相手なし' ? afterFoulOppVal : afterFoulOppTeamName + fmtPlayer(afterFoulOppVal)) : '';

        lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　のファウル');
        if (afterFoulTeamName !== teamName) {
          lines.push('チーム: ' + teamName + ' → ' + afterFoulTeamName);
        }
        if (afterFoulPlayer && (afterFoulPlayer !== beforeFoulPlayer || afterFoulTeamName !== teamName)) {
          lines.push('ファウルした選手: ' + teamName + beforeFoulPlayer + ' → ' + afterFoulTeamName + afterFoulPlayer);
        }
        if (afterFoulType && afterFoulType !== beforeFoulType) {
          lines.push('種類: ' + beforeFoulType + ' → ' + afterFoulType);
        }
        if (afterFoulOppText && afterFoulOppText !== beforeFoulOppText) {
          lines.push('REC選手: ' + (beforeFoulOppText || '指定なし') + ' → ' + afterFoulOppText);
        }
        if (clockPrefix) {
          lines.push('クロック: ' + clock + ' → ' + afterClock);
        }
      } else if (def.field === 'subInOutFull') {
        var subTeam = getSegValue('modSubTeamSeg') || 'home';
        lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　の選手交代');
        var readMulti = function (id) {
          var sel = document.getElementById(id);
          return sel ? Array.prototype.filter.call(sel.options, function (o) { return o.selected; }).map(function (o) { return o.value; }) : [];
        };
        var sameSet = function (a, b) {
          if (a.length !== b.length) return false;
          var as = a.slice().sort(), bs = b.slice().sort();
          return as.every(function (v, i) { return v === bs[i]; });
        };
        var fmtList = function (arr) { return arr.map(fmtPlayer).join(' '); };
        var collectSub = function (teamKey, teamLabel) {
          var cap = teamKey === 'home' ? 'Home' : 'Away';
          var beforeIn = readMulti('modSubBeforeIn' + cap + 'Multi');
          var afterIn = readMulti('modSubAfterIn' + cap + 'Multi');
          var beforeOut = readMulti('modSubBeforeOut' + cap + 'Multi');
          var afterOut = readMulti('modSubAfterOut' + cap + 'Multi');
          if (afterIn.length && !sameSet(afterIn, beforeIn)) {
            lines.push(teamLabel + 'IN選手: ' + fmtList(beforeIn) + ' → ' + fmtList(afterIn));
          }
          if (afterOut.length && !sameSet(afterOut, beforeOut)) {
            lines.push(teamLabel + 'OUT選手: ' + fmtList(beforeOut) + ' → ' + fmtList(afterOut));
          }
        };
        if (subTeam === 'home' || subTeam === 'both') collectSub('home', currentHomeName());
        if (subTeam === 'away' || subTeam === 'both') collectSub('away', currentAwayName());
        if (clockPrefix) {
          lines.push('クロック: ' + clock + ' → ' + afterClock);
        }
      } else if (def.field === 'onCourtFive') {
        var ocTeam = getSegValue('modOnCourtTeamSeg') || 'home';
        lines.push(period + ' ' + clock + 'の交代を　オンザコート');
        if (clockPrefix) {
          lines.push('クロック: ' + clock + ' → ' + afterClock);
        }
        var collectOnCourt = function (teamKey, teamLabel) {
          var cap = teamKey === 'home' ? 'Home' : 'Away';
          var sel = document.getElementById('modOnCourt' + cap + 'Multi');
          var nums = sel ? Array.prototype.filter.call(sel.options, function (o) { return o.selected; }).map(function (o) { return fmtPlayer(o.value); }) : [];
          if (nums.length) lines.push(teamLabel + ': ' + nums.join(' ') + 'で入力してください。');
        };
        if (ocTeam === 'home' || ocTeam === 'both') collectOnCourt('home', currentHomeName());
        if (ocTeam === 'away' || ocTeam === 'both') collectOnCourt('away', currentAwayName());
      } else {
        var beforeText, afterText;
        var aspectLabel = def.label;
        if (def.field === 'secondaryPlayer') {
          beforeText = fmtPlayer(getRosterVal(modFieldsContainer, 'modBeforePlayer'));
          afterText = fmtPlayer(getRosterVal(modFieldsContainer, 'modAfterPlayer'));
        } else if (def.field === 'scoreDetail') {
          var beforeType = val('modBeforeScoreType');
          var afterType = val('modAfterScoreType');
          var beforeResult = val('modBeforeScoreResult');
          var afterResult = val('modAfterScoreResult');
          if (beforeType === afterType && beforeResult === afterResult) {
            aspectLabel = 'シュート種類';
            beforeText = val('modBeforeShotStyle') || '指定なし';
            afterText = val('modAfterShotStyle') || '指定なし';
          } else {
            beforeText = buildScoreDetailText('modBefore');
            afterText = buildScoreDetailText('modAfter');
          }
        } else if (def.field === 'reboundType') {
          beforeText = val('modBeforeReboundType');
          afterText = val('modAfterReboundType');
        } else if (def.field === 'shotStyleOnly') {
          beforeText = val('modBeforeShotStyleOnly') || '指定なし';
          afterText = val('modAfterShotStyleOnly') || '指定なし';
        } else if (def.field === 'fastbreakOnly') {
          beforeText = val('modBeforeFastbreakOnly');
          afterText = val('modAfterFastbreakOnly');
        } else if (def.field === 'freeText') {
          beforeText = val('modBeforeFree');
          afterText = val('modAfterFree');
        }
        lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　' + teamName + (subject ? ' ' + subject : '') + 'の' + aspectLabel);
        lines.push(beforeText + ' → ' + clockPrefix + afterText);
      }
    } else {
      var subject2 = needsPlayer ? fmtPlayer(player) : getSegValueIn(panelA, 'seg-foul-target');
      lines.push('【' + correctionLabel + '】' + period + ' ' + clock + '　' + teamName + ' ' + subject2);
      var detail = buildDetailLine(panelA);
      lines.push('内容: ' + playLabels[panelPlayType(panelA)] + (detail ? ' / ' + detail : ''));
    }

    var memo = val('memo');
    if (memo) lines.push('修正理由: ' + memo);

    return { text: lines.join('\n'), team: team, teamName: teamName };
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 12))); } catch (e) {}
  }

  function renderHistory() {
    var list = loadHistory();
    var wrap = document.getElementById('historyList');
    if (!list.length) {
      wrap.innerHTML = '<p class="history-empty">まだ履歴はありません。</p>';
      return;
    }
    wrap.innerHTML = '';
    list.forEach(function (item, idx) {
      var row = document.createElement('div');
      row.className = 'history-item';

      var textWrap = document.createElement('div');
      textWrap.className = 'history-text';
      var badge = document.createElement('span');
      badge.className = 'badge ' + item.team;
      badge.textContent = item.teamName || (item.team === 'home' ? 'ホーム' : 'アウェイ');
      textWrap.appendChild(badge);
      textWrap.appendChild(document.createTextNode(item.text));
      row.appendChild(textWrap);

      var right = document.createElement('div');
      right.className = 'history-right';

      var status = document.createElement('div');
      status.className = 'history-status';

      function makeCheck(labelText, key) {
        var label = document.createElement('label');
        label.className = 'hist-check';
        if (item[key]) label.classList.add('on');
        var cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = !!item[key];
        cb.addEventListener('change', function () {
          var l = loadHistory();
          if (!l[idx]) return;
          l[idx][key] = cb.checked;
          saveHistory(l);
          label.classList.toggle('on', cb.checked);
        });
        label.appendChild(cb);
        label.appendChild(document.createTextNode(labelText));
        return label;
      }
      status.appendChild(makeCheck('送信済み', 'sent'));
      status.appendChild(makeCheck('修正確認済み', 'confirmed'));
      right.appendChild(status);

      var actions = document.createElement('div');
      actions.className = 'history-actions';

      var copyB = document.createElement('button');
      copyB.className = 'icon-btn';
      copyB.type = 'button';
      copyB.textContent = 'コピー';
      copyB.addEventListener('click', function () { copyText(item.text, copyB); });
      actions.appendChild(copyB);

      var delB = document.createElement('button');
      delB.className = 'icon-btn';
      delB.type = 'button';
      delB.textContent = '削除';
      delB.addEventListener('click', function () {
        var l = loadHistory();
        l.splice(idx, 1);
        saveHistory(l);
        renderHistory();
      });
      actions.appendChild(delB);

      right.appendChild(actions);
      row.appendChild(right);
      wrap.appendChild(row);
    });
  }

  function copyText(text, btn) {
    function done() {
      var original = btn.textContent;
      btn.textContent = 'コピーしました';
      btn.classList.add('copied');
      setTimeout(function () {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text, done); });
    } else {
      fallbackCopy(text, done);
    }
  }
  function fallbackCopy(text, cb) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    cb();
  }

  var outputEl = document.getElementById('outputText');
  var copyBtn = document.getElementById('copyBtn');
  var currentText = '';

  document.getElementById('generateBtn').addEventListener('click', function () {
    var result = generate();
    if (!result) return;
    currentText = result.text;
    outputEl.textContent = result.text;
    outputEl.classList.remove('output-empty');

    var list = loadHistory();
    list.unshift({ text: result.text, team: result.team, teamName: result.teamName });
    saveHistory(list);
    renderHistory();
  });

  copyBtn.addEventListener('click', function () {
    if (!currentText) return;
    copyText(currentText, copyBtn);
  });

  renderHistory();
})();
</script>
</body>
